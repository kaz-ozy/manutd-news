name: ニュースを更新

on:
  schedule:
    - cron: "0 0 * * *"   # 毎日 日本時間の午前9時ごろ(世界標準時の0時)
  workflow_dispatch:       # 手動でも動かせるようにする

permissions:
  contents: write          # 更新したnews.jsonを保存するために必要

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 監督・選手の名簿を更新する
        run: python scripts/update_people.py
      - name: ニュースを集める
        run: python scripts/fetch_news.py
      - name: 戦術コラムの記事を集める
        run: python scripts/fetch_tactics.py
      - name: 変更があれば保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.json docs/people.json docs/tactics.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "ニュースを更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi
