<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マンU移籍ニュース</title>
<style>
  :root { --bg:#fafafa; --card:#fff; --text:#1a1a1a; --sub:#666; --line:#e3e3e3; --accent:#c8102e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --card:#1e1e1e; --text:#eee; --sub:#aaa; --line:#333; --accent:#ff5a6e; }
  }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans",sans-serif; line-height:1.6; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:8px 0 4px; border-left:6px solid var(--accent); padding-left:10px; }
  .tabs { display:flex; gap:4px; margin:12px 0 0; border-bottom:2px solid var(--line); }
  .tabs button { border:0; background:none; color:var(--sub); padding:8px 14px; font-size:1rem; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; }
  .tabs button.on { color:var(--accent); border-bottom-color:var(--accent); font-weight:700; }
  .info { color:var(--sub); font-size:.85rem; margin:2px 0; }
  .filters { margin:12px 0; display:flex; gap:8px; flex-wrap:wrap; }
  .filters button { border:1px solid var(--line); background:var(--card); color:var(--text); padding:6px 12px; border-radius:16px; cursor:pointer; }
  .filters button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  ul { list-style:none; padding:0; margin:0; }
  li { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin:8px 0; }
  li a { color:var(--text); font-weight:600; text-decoration:none; }
  li a:hover { text-decoration:underline; }
  .orig { color:var(--sub); font-size:.75rem; margin-top:2px; }
  .meta { color:var(--sub); font-size:.8rem; margin-top:4px; }
  .badge { display:inline-block; font-size:.75rem; background:var(--line); border-radius:4px; padding:1px 6px; margin:4px 4px 0 0; }
  .yen { background:var(--accent); color:#fff; }
  footer { color:var(--sub); font-size:.75rem; margin:24px 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>マンチェスター・ユナイテッド 移籍ニュース</h1>
  <div class="tabs">
    <button data-tab="transfer" class="on">移籍ニュース</button>
    <button data-tab="tactics">戦術コラム</button>
  </div>

  <section id="tab-transfer">
    <p class="info" id="manager"></p>
    <p class="info" id="updated">読み込み中…</p>
    <p class="info" id="rate"></p>
    <div class="filters" id="langFilters">
      <button data-lang="all" class="on">すべて</button>
      <button data-lang="ja">日本語</button>
      <button data-lang="en">English</button>
    </div>
    <ul id="list"></ul>
  </section>

  <section id="tab-tactics" hidden>
    <p class="info">チームごとの、戦術に関する記事のタイトルとリンクです(本文は載せていません)。</p>
    <div class="filters" id="teamFilters"></div>
    <p class="info" id="tupdated"></p>
    <ul id="tlist"></ul>
  </section>

  <footer>記事の本文は載せていません。タイトルをタップすると元のサイトへ移動します。英語タイトルの日本語訳はClaudeによる翻訳です(新しい記事は翻訳待ちの間、英語のまま表示されます)。英語の記事ページはChromeの翻訳機能で日本語にできます。円換算はタイトルに書かれた金額をその日のレートで計算した目安です。</footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
let articles = [], people = { manager: null, players: [] }, titlesJa = {}, lang = "all";
let tactics = { teams: {} }, team = null;

const isJa = (t) => /[぀-ヿ一-鿿]/.test(t);
const fmtDate = (iso) => new Date(iso).toLocaleDateString("ja-JP", { timeZone: "Asia/Tokyo", month: "long", day: "numeric" });

function playerBadges(title) {
  const lower = title.toLowerCase();
  return (people.players || []).filter(p => (p.names || []).some(n => lower.includes(n.toLowerCase())));
}

// 記事1件ぶんのカードを作る(移籍ニュースと戦術コラムで共通)
function card(a, withBadges) {
  const li = document.createElement("li");
  const link = document.createElement("a");
  link.href = a.url; link.target = "_blank"; link.rel = "noopener noreferrer";
  const tja = titlesJa[a.url];
  link.textContent = tja || a.title;
  li.append(link);
  if (tja) {
    const orig = document.createElement("div");
    orig.className = "orig";
    orig.textContent = "原題:" + a.title;
    li.append(orig);
  }
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = `${a.source} ・ ${fmtDate(a.date)}`;
  li.append(meta);
  if (withBadges) {
    if (a.price_jpy) { const b = document.createElement("span"); b.className = "badge yen"; b.textContent = "💴 " + a.price_jpy; li.append(b); }
    for (const p of playerBadges(a.title)) {
      const b = document.createElement("span"); b.className = "badge";
      b.textContent = `${p.names[0]}:${p.club}`; li.append(b);
    }
  }
  return li;
}

function renderTransfer() {
  const list = $("list");
  list.textContent = "";
  const shown = articles.filter(a => lang === "all" || (lang === "ja") === isJa(a.title));
  shown.forEach(a => list.append(card(a, true)));
  if (!shown.length) list.textContent = "該当する記事がありません。";
}

function renderTactics() {
  const box = $("teamFilters");
  box.textContent = "";
  const ids = Object.keys(tactics.teams);
  if (!team || !tactics.teams[team]) team = ids[0] || null;
  ids.forEach(id => {
    const b = document.createElement("button");
    b.textContent = tactics.teams[id].name;
    b.className = id === team ? "on" : "";
    b.onclick = () => { team = id; renderTactics(); };
    box.append(b);
  });
  const list = $("tlist");
  list.textContent = "";
  if (!team) { list.textContent = "データを読み込めませんでした。"; return; }
  const arts = tactics.teams[team].articles;
  $("tupdated").textContent = tactics.updated
    ? `最終更新:${new Date(tactics.updated).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" })}(${arts.length}件)` : "";
  arts.forEach(a => list.append(card(a, false)));
  if (!arts.length) list.textContent = "該当する記事がありません。";
}

document.querySelectorAll("#langFilters button").forEach(btn => btn.onclick = () => {
  lang = btn.dataset.lang;
  document.querySelectorAll("#langFilters button").forEach(b => b.classList.toggle("on", b === btn));
  renderTransfer();
});

document.querySelectorAll(".tabs button").forEach(btn => btn.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b === btn));
  $("tab-transfer").hidden = btn.dataset.tab !== "transfer";
  $("tab-tactics").hidden = btn.dataset.tab !== "tactics";
});

Promise.all([
  fetch("news.json").then(r => r.json()),
  fetch("people.json").then(r => r.json()).catch(() => people),
  fetch("titles_ja.json").then(r => r.json()).catch(() => ({})),
  fetch("tactics.json").then(r => r.json()).catch(() => tactics),
]).then(([news, ppl, tj, tac]) => {
  articles = news.articles; people = ppl; titlesJa = tj; tactics = tac;
  $("updated").textContent = `最終更新:${new Date(news.updated).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" })}(${articles.length}件)`;
  if (news.rates) {
    const r = news.rates.JPY_per;
    $("rate").textContent = `為替レート(${news.rates.date}時点):1ポンド=${r.GBP}円 / 1ユーロ=${r.EUR}円 / 1ドル=${r.USD}円`;
  } else $("rate").textContent = "為替レートを取得できませんでした。";
  const lines = [];
  if (ppl.manager && ppl.manager.name) {
    lines.push(`現在の監督:${ppl.manager.name}(出典:${ppl.manager.source}、${ppl.manager.checked}に確認)`);
  }
  for (const f of ppl.front || []) lines.push(`${f.role}:${f.name}(出典:${f.source}、${f.checked}に確認)`);
  if (ppl.players_note) lines.push(ppl.players_note);
  $("manager").innerHTML = "";
  lines.forEach(t => { const d = document.createElement("div"); d.textContent = t; $("manager").append(d); });
  renderTransfer();
  renderTactics();
}).catch(() => { $("updated").textContent = "データを読み込めませんでした。"; });
</script>
</body>
</html>
